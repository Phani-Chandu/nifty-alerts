# Save this in your repo as:  .github/workflows/nifty-alerts.yml
#
# Runs the NIFTY 5m alert bot every trading day on GitHub's servers, free,
# on your EXISTING Kotak Neo (or ICICI Direct) account. No second demat needed.
#
# WHY THIS WORKS ON A DYNAMIC IP
#   Kotak Neo's docs: "IP validation is enforced only on order APIs."
#   Login, Data, Portfolio, Report and Websocket APIs are exempt. This bot only
#   logs in and reads data - it never places an order - so GitHub's random runner
#   IPs are fine. Same for ICICI Direct Breeze.
#
# WHY THIS IS FREE
#   GitHub Actions minutes are unlimited and unmetered on PUBLIC repositories.
#   Credentials live in encrypted repository Secrets, never in the code.
#
# TIMING
#   GitHub cron is UTC. IST = UTC + 5:30.
#     03:50 UTC = 09:20 IST   (job starts; no entries before 09:30 anyway)
#     + 355 min = 15:15 IST   (GitHub's hard cap is 360 min per job)
#   GitHub's scheduler is best-effort and can start 5-20 minutes late.
name: NIFTY 5m alerts
on:
  schedule:
    - cron: '50 3 * * 1-5'
  workflow_dispatch:
concurrency:
  group: nifty-alerts
  cancel-in-progress: false
permissions:
  contents: write        # needed to commit bars.csv back to the repo
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyotp
          if [ "${{ vars.BROKER || 'kotak' }}" = "breeze" ]; then
            pip install breeze-connect
          else
            pip install kotakneoapi
          fi
      - name: Run alert bot
        env:
          BROKER: ${{ vars.BROKER || 'kotak' }}
          # --- Kotak Neo (default) ---
          KOTAK_CONSUMER_KEY:    ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_CONSUMER_SECRET: ${{ secrets.KOTAK_CONSUMER_SECRET }}
          KOTAK_MOBILE:          ${{ secrets.KOTAK_MOBILE }}
          KOTAK_UCC:             ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN:            ${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_SECRET:     ${{ secrets.KOTAK_TOTP_SECRET }}
          # --- ICICI Direct Breeze (only if BROKER=breeze) ---
          # The session token dies at midnight, so you must refresh this secret
          # every morning. That is why Kotak is the default for live alerts.
          BREEZE_API_KEY:        ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET:     ${{ secrets.BREEZE_API_SECRET }}
          BREEZE_SESSION_TOKEN:  ${{ secrets.BREEZE_SESSION_TOKEN }}
          # --- notifications: set Telegram, ntfy, or both ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          CAPITAL:          ${{ vars.CAPITAL || '300000' }}
          PYTHONUNBUFFERED: '1'
        run: python alert_bot.py
      # Kotak Neo has no historical-candle API, so the bot builds its own 5m bars
      # from live quotes and writes bars.csv. Committing it is what lets tomorrow
      # start warm - without this step the bot re-warms from scratch every morning
      # and cannot produce a valid signal until roughly 13:30.
      - name: Save bar history
        if: always() && (vars.BROKER || 'kotak') == 'kotak'
        run: |
          if [ -f bars.csv ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bars.csv
            git commit -m "bars: $(date -u +%Y-%m-%d)" || exit 0
            git pull --rebase --autostash || true
            git push
          else
            echo "no bars.csv produced"
          fi
  # GitHub silently disables scheduled workflows in repos with no activity for
  # 60 days - you just stop getting alerts one morning with no warning. When
  # BROKER=kotak the daily bars.csv commit already counts as activity; this job
  # is the safety net for the Breeze path, which writes nothing.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Weekly heartbeat
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u > .keepalive
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive" || exit 0
            git pull --rebase --autostash || true
            git push
          fi
